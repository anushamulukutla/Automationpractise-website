<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nested frame level 1</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body class="frame-body">
  <h2 data-testid="nested-l1-title">Level 1 frame</h2>
  <div class="row">
    <button type="button" class="btn" data-testid="nested-l1-btn">Click level 1</button>
    <span class="result" role="status" data-testid="nested-l1-result"></span>
  </div>
  <iframe style="height:220px;margin-top:8px" src="/frames/nested-2.html" title="Nested iframe level 2" data-testid="nested-iframe-l2"></iframe>
  <script>
    document.querySelector('[data-testid="nested-l1-btn"]').addEventListener('click', function () {
      document.querySelector('[data-testid="nested-l1-result"]').textContent = 'Level 1 button clicked';
    });
  </script>
</body>
</html>
